name: Package Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  package-checks:
    name: Source-Wire package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Gate B scope enforcement directly
        run: |
          node scripts/global-owner-hosted-runtime-v1-gate-b-memory-only.mjs --self-test
          node scripts/global-owner-hosted-runtime-v1-gate-b-memory-only.mjs

      - name: Verify public Alpha local runtime candidate
        run: |
          npm run alpha1:build
          npm run local-runtime:candidate-smoke
          npm run local-runtime:security-gate

      - name: Run publish readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:readiness

  alpha-postgres-conformance:
    name: Source-Wire Alpha PostgreSQL conformance (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: authoritative-18.4
            image: "18.4"
            expected_major: "18"
            expected_version_num: "180004"
            compatibility_major: ""
          - label: compatibility-16
            image: "16"
            expected_major: "16"
            expected_version_num: ""
            compatibility_major: "16"

    services:
      postgres:
        image: postgres:${{ matrix.image }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: source_wire_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout pinned evidence-first adapter
        uses: actions/checkout@v5
        with:
          repository: DanielJD1216/evidence-first-knowledge-base
          ref: a01cd307582cecbed54c4ca8e7873d7f9df1ecb8
          path: evidence-first-knowledge-base
          persist-credentials: false

      - name: Build and test pinned evidence-first adapter
        working-directory: evidence-first-knowledge-base
        run: |
          npm ci
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install private evidence-first adapter package
        shell: bash
        run: |
          set -Eeuo pipefail
          adapter_packages=("$RUNNER_TEMP"/doomade-evidence-first-source-wire-adapter-*.tgz)
          test "${#adapter_packages[@]}" -eq 1
          npm install --no-save --package-lock=false --ignore-scripts "${adapter_packages[0]}"
          rm -rf -- evidence-first-knowledge-base
          test ! -e evidence-first-knowledge-base

      - name: Run Alpha PostgreSQL conformance
        env:
          EXPECTED_POSTGRES_MAJOR: ${{ matrix.expected_major }}
          EXPECTED_POSTGRES_VERSION_NUM: ${{ matrix.expected_version_num }}
          POSTGRES_COMPATIBILITY_MAJOR: ${{ matrix.compatibility_major }}
          PGDATABASE: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: source_wire_ci_${{ github.run_id }}_${{ github.run_attempt }}
          PGPORT: 5432
          PGUSER: postgres
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "SOURCE_WIRE_ALPHA_POSTGRES_GATE_FAILED status=${status}"; exit "${status}"' ERR
          test "$(node --version)" = "v22.23.1"
          export SOURCE_WIRE_EXPECTED_POSTGRES_MAJOR="$EXPECTED_POSTGRES_MAJOR"
          if [[ -n "$EXPECTED_POSTGRES_VERSION_NUM" ]]; then
            export SOURCE_WIRE_EXPECTED_POSTGRES_VERSION_NUM="$EXPECTED_POSTGRES_VERSION_NUM"
          else
            unset SOURCE_WIRE_EXPECTED_POSTGRES_VERSION_NUM
          fi
          if [[ -n "$POSTGRES_COMPATIBILITY_MAJOR" ]]; then
            export SOURCE_WIRE_POSTGRES_COMPATIBILITY_MAJOR="$POSTGRES_COMPATIBILITY_MAJOR"
          else
            unset SOURCE_WIRE_POSTGRES_COMPATIBILITY_MAJOR
          fi
          echo "SOURCE_WIRE_ALPHA_POSTGRES_GATE_BEGIN node=v22.23.1 postgres=${{ matrix.label }} stories=1-5 providers=baseline,replaceable,evidence-first candidate=local-runtime-alpha.2 data=generated_disposable"
          npm run alpha1:story5:security-gate
          npm run alpha1:conformance
          npm run alpha1:conformance:evidence-first
          npm run local-runtime:candidate-conformance
          echo "SOURCE_WIRE_ALPHA_POSTGRES_GATE_SUCCESS node=v22.23.1 postgres=${{ matrix.label }} stories=1-5 providers=baseline,replaceable,evidence-first candidate=local-runtime-alpha.2 cleanup=verified"
